<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="class-1">
    <meta property="og:description" content="This is a simple HTML page for class-1">
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/290224556?v=4">
    <title>class-1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f3f7ff, #e6f7ff);
            margin: 0;
            padding: 40px 20px;
            color: #1f2937;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }

        h1, h2, h3, h4 {
            margin: 16px 0;
            color: #111827;
        }

        h1 {
            font-size: 2.5rem;
            color: #2563eb;
        }

        h2 {
            font-size: 2rem;
            color: #1d4ed8;
        }

        h3 {
            font-size: 1.5rem;
        }

        h4 {
            font-size: 1.2rem;
            color: #374151;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.7;
            margin: 12px 0;
        }

        .highlight {
            font-weight: bold;
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>lorem <span class="highlight">ipsum</span></p>
        <h1>hello</h1>
        <h2>world</h2>
        <h3>my name is manas</h3>
        <h4>this is a heading level 4</h4>
        <p>my name is manas and i am in zenith school of ai</p>
    </div>
</body>
</html>
